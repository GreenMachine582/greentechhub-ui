name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,playground]"
      - run: ruff check .
      - run: pytest

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,playground,e2e]"
      - run: playwright install --with-deps chromium
      - run: pytest tests/e2e/

  # The same e2e suite on the htmx=1 opt-out (1.9.10), for the one release
  # it's kept after htmx 2 became the default — docs/htmx2.md.
  e2e-htmx1:
    runs-on: ubuntu-latest
    env:
      PLAYGROUND_HTMX: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,playground,e2e]"
      - run: playwright install --with-deps chromium
      - run: pytest tests/e2e/
