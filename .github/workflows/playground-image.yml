# Builds the playground image (playground/Dockerfile) for amd64 and arm64 and
# pushes it to ghcr.io/greenmachine582/greentechhub-ui-playground. The homelab
# cluster runs it (arm64 Pis), pinned by tag and digest.
#
# Tags: pushes to dev publish `dev` and `sha-<short>`; release tags (vX.Y.Z,
# created by release-please) publish `X.Y.Z`, `X.Y` and `latest`. Pull
# requests build and smoke-test only, nothing is pushed.
name: playground-image

on:
  pull_request:
    paths:
      - "playground/**"
      - "src/**"
      - "pyproject.toml"
      - ".dockerignore"
      - ".github/workflows/playground-image.yml"
  push:
    branches: [dev]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/greenmachine582/greentechhub-ui-playground

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/dev' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=greentechhub-ui playground
            org.opencontainers.image.description=Demo app exercising every gth-* component

      # Smoke test first: the amd64 build must start and serve the index
      # (with the package's static files) before anything is pushed.
      - name: Build for the smoke test (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: playground/Dockerfile
          platforms: linux/amd64
          load: true
          tags: playground:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name playground -p 8500:8500 playground:smoke
          for _ in $(seq 30); do
            curl -fsS -o /dev/null http://localhost:8500/ && break
            sleep 1
          done
          curl -fsS http://localhost:8500/ | grep -q "gth-" \
            || { docker logs playground; exit 1; }
          css="$(curl -fsS http://localhost:8500/ | grep -o 'href="[^"]*\.css"' | head -1 | cut -d'"' -f2)"
          [ -n "$css" ] && curl -fsS -o /dev/null "http://localhost:8500${css}" \
            || { echo "static CSS not served: '${css}'"; docker logs playground; exit 1; }

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: playground/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
