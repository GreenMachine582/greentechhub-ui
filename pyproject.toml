# pyproject.toml
[project]
name = "greentechhub-ui"
version = "0.7.0"
description = "Shared UI framework for the GreenTechHub ecosystem"
requires-python = ">=3.12"
dependencies = ["jinja2>=3.1"]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "html5lib>=1.1",
    # test-only: greentechhub_ui never imports this at runtime
    "greentechhub-core @ git+https://github.com/GreenMachine582/greentechhub-core.git@v0.6.0",
    # test-only, for tests/test_playground_routes.py's ASGITransport client
    "httpx>=0.27",
]
playground = ["fastapi>=0.100", "uvicorn[standard]>=0.23", "python-multipart>=0.0.9"]
e2e = ["pytest-playwright>=0.4"]
# test-only, for tests/test_contract_django.py; pinned to match GreenTechHub's real Django version
django = ["django>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/greentechhub_ui"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
