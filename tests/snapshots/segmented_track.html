
        


<div class="mb-3 gth-form-field gth-segmented">
  <span class="form-label d-block" id="gth-field-theme-label">Theme</span>
  <div class="gth-segmented-track" role="group" aria-labelledby="gth-field-theme-label">
    
    <input type="radio" class="btn-check" name="theme" value="light"
      id="gth-field-theme-1" autocomplete="off">
    <label class="btn gth-segmented-option" for="gth-field-theme-1">Light</label>
    
    <input type="radio" class="btn-check" name="theme" value="dark"
      id="gth-field-theme-2" autocomplete="off" checked>
    <label class="btn gth-segmented-option" for="gth-field-theme-2">Dark</label>
    
  </div>
</div>
