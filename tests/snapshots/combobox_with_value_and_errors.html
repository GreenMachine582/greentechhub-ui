
        

<div class="mb-3 gth-form-field">
  <label class="form-label" for="gth-field-stock_id-search">Stock</label>
  <div class="position-relative gth-combobox" data-gth-combobox data-gth-combobox-url="/stocks/options">
    <input type="text" class="form-control is-invalid"
      id="gth-field-stock_id-search" name="stock_id_search" data-gth-combobox-input
      value="BHP · ASX" placeholder="Search…"
      autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false"
      aria-controls="gth-field-stock_id-results"
      aria-invalid="true"
      aria-describedby="gth-field-stock_id-help gth-field-stock_id-error">
    <input type="hidden" name="stock_id" value="7" data-gth-combobox-value>
    <div id="gth-field-stock_id-results" class="list-group position-absolute w-100 shadow d-none gth-combobox-results"
      role="listbox" aria-label="Stock options" data-gth-combobox-results></div>
  </div>
  <div class="form-text" id="gth-field-stock_id-help">Pick from the list.</div>
  
  <div class="invalid-feedback d-block" id="gth-field-stock_id-error">
    Choose a stock.
  </div>
  
</div>
