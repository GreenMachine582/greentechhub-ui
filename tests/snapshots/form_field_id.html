
        
<div class="mb-3 gth-form-field">
  <label class="form-label" for="buy-price">Price</label>
  <div class="input-group has-validation"><span class="input-group-text" id="buy-price-prefix">$</span>
  <input type="text" id="buy-price" name="price"
    class="form-control is-invalid"
    value="1.5"
    
    
     maxlength="10"
    aria-invalid="true"
    aria-describedby="buy-price-help buy-price-prefix buy-price-suffix buy-price-counter buy-price-error"
    ><span class="input-group-text" id="buy-price-suffix">AUD</span>
  </div>
  <div class="form-text gth-char-counter" id="buy-price-counter" data-gth-counter-for="buy-price">3 / 10</div>
  <div class="form-text" id="buy-price-help">Per unit</div>
  
  <div class="invalid-feedback d-block" id="buy-price-error">
    Too high
  </div>
  
</div>
