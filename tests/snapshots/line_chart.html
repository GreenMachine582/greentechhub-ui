<figure class="gth-chart gth-line-chart">
  <figcaption class="gth-chart-caption">Cost base</figcaption>
  <div class="gth-chart-body" style="height: 180px">
    <div class="gth-chart-y" aria-hidden="true">
      <span style="top: 0%">$100</span>
      <span style="top: 100%">$0</span>
    </div>
    <svg class="gth-chart-plot gth-chart-primary" width="100%" height="100%" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
      <polygon class="gth-chart-area" points="0,100 0.00,100.00 50.00,50.00 100.00,0.00 100,100"/>
      <polyline class="gth-chart-line" points="0.00,100.00 50.00,50.00 100.00,0.00"/>
    </svg>
  </div>
  <div class="gth-chart-x" aria-hidden="true">
    <span style="left: 0.00%">Jul</span>
    <span style="left: 50.00%">Aug</span>
    <span style="left: 100.00%">Sep</span>
  </div>
  <table class="visually-hidden">
    <caption>Cost base</caption>
    <thead><tr><th scope="col">Label</th><th scope="col">Value</th></tr></thead>
    <tbody>
      <tr><th scope="row">Jul</th><td>$0</td></tr>
      <tr><th scope="row">Aug</th><td>$50</td></tr>
      <tr><th scope="row">Sep</th><td>$100</td></tr>
    </tbody>
  </table>
</figure>
