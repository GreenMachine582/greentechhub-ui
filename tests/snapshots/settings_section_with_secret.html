
        <section class="gth-settings-section mb-4" id="gth-settings-integrations" aria-labelledby="gth-settings-integrations-title">
  <h2 class="h5 mb-1" id="gth-settings-integrations-title">Integrations</h2>
  <form method="post" action="/settings/integrations" class="gth-form" novalidate>
  
<div class="mb-3 gth-form-field">
  <label class="form-label" for="gth-field-site.banner">Banner</label>
  <input type="text" id="gth-field-site.banner" name="site.banner"
    class="form-control"
    value=""
    
    
    
    
    
    >
  
  
</div>

  
<div class="mb-2 gth-form-field">
  <label class="form-label" for="gth-field-billing.api_token">API token</label>
  <input type="password" id="gth-field-billing.api_token" name="billing.api_token"
    class="form-control"
    value=""
    
    
    
    
    aria-describedby="gth-field-billing.api_token-help"
    autocomplete="new-password" >
  <div class="form-text" id="gth-field-billing.api_token-help">From your billing provider. Saved. Leave blank to keep it.</div>
  
</div>

<div class="form-check mb-3 gth-setting-clear">
  <input class="form-check-input" type="checkbox" id="gth-field-billing.api_token.__clear" name="billing.api_token.__clear" value="true">
  <label class="form-check-label" for="gth-field-billing.api_token.__clear">Remove the saved value</label>
</div>
  <button type="submit" class="btn btn-primary">Save</button>
  </form>
</section>
