
        


<div class="mb-3 gth-form-field gth-segmented">
  <span class="form-label d-block" id="trade-side-label">Side</span>
  <div class="gth-segmented-track is-invalid" role="group" aria-labelledby="trade-side-label" aria-describedby="trade-side-help trade-side-error">
    
    <input type="radio" class="btn-check" name="side" value="buy"
      id="trade-side-1" autocomplete="off" checked>
    <label class="btn gth-segmented-option" for="trade-side-1">Buy</label>
    
    <input type="radio" class="btn-check" name="side" value="sell"
      id="trade-side-2" autocomplete="off">
    <label class="btn gth-segmented-option" for="trade-side-2">Sell</label>
    
  </div>
  <div class="form-text" id="trade-side-help">Which way</div>
  <div class="invalid-feedback d-block" id="trade-side-error">Pick one</div>
</div>
