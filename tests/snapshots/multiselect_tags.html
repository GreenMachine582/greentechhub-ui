  <label class="form-label" for="gth-field-tags-search">Tags</label>
  <div class="position-relative gth-combobox gth-multiselect" data-gth-combobox data-gth-combobox-multi
    data-gth-combobox-name="tags" data-gth-combobox-create>
    <div class="form-control d-flex flex-wrap align-items-center gap-1 gth-multiselect-control">
      <span class="d-flex flex-wrap gap-1" data-gth-combobox-chips></span>
      <input type="text" class="gth-multiselect-input flex-grow-1"
        id="gth-field-tags-search" name="tags_search" data-gth-combobox-input
        placeholder="Search…" autocomplete="off">
    </div>
    <div id="gth-field-tags-results" class="list-group position-absolute w-100 shadow d-none gth-combobox-results"
      role="listbox" aria-multiselectable="true" aria-label="Tags options" data-gth-combobox-results></div>
  </div>
  <div class="visually-hidden" aria-live="polite" data-gth-combobox-live></div>
  
  
</div>
