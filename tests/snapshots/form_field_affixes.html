
<div class="mb-3 gth-form-field">
  <label class="form-label" for="gth-field-budget">Budget</label>
  <div class="input-group has-validation"><span class="input-group-text" id="gth-field-budget-prefix">$</span>
  <input type="number" id="gth-field-budget" name="budget"
    class="form-control is-invalid"
    value="250"
    
    
    
    aria-invalid="true"
    aria-describedby="gth-field-budget-help gth-field-budget-prefix gth-field-budget-suffix gth-field-budget-error"
    ><span class="input-group-text" id="gth-field-budget-suffix">AUD</span>
  </div>
  <div class="form-text" id="gth-field-budget-help">Per month.</div>
  
  <div class="invalid-feedback d-block" id="gth-field-budget-error">
    Too high.
  </div>
  
</div>
