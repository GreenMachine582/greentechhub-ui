
        


<div class="mb-3 gth-form-field gth-segmented">
  <span class="form-label d-block" id="gth-field-mode-label">Mode</span>
  <div class="gth-segmented-track is-invalid" role="group" aria-labelledby="gth-field-mode-label" aria-describedby="gth-field-mode-help gth-field-mode-error">
    
    <input type="radio" class="btn-check" name="mode" value="a"
      id="gth-field-mode-1" autocomplete="off">
    <label class="btn gth-segmented-option" for="gth-field-mode-1">A</label>
    
    <input type="radio" class="btn-check" name="mode" value="b"
      id="gth-field-mode-2" autocomplete="off" checked>
    <label class="btn gth-segmented-option" for="gth-field-mode-2">B</label>
    
  </div>
  <div class="form-text" id="gth-field-mode-help">Either.</div>
  <div class="invalid-feedback d-block" id="gth-field-mode-error">Not that one.</div>
</div>
