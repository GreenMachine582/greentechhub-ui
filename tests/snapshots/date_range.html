

<div class="mb-3 gth-form-field gth-date-range" role="group" aria-labelledby="gth-field-date_from-label"
  data-gth-date-range data-fy-start-month="7">
  <span class="form-label d-block" id="gth-field-date_from-label">Date range</span>
  <div class="d-flex flex-wrap align-items-center gap-2">
    
    <div class="input-group w-auto">
      <label class="input-group-text" for="gth-field-date_from">From</label>
      <input type="date" class="form-control" id="gth-field-date_from" name="date_from"
        value="" data-gth-date-from>
    </div>
    
    <div class="input-group w-auto">
      <label class="input-group-text" for="gth-field-date_to">To</label>
      <input type="date" class="form-control" id="gth-field-date_to" name="date_to"
        value="" data-gth-date-to>
    </div>
    
    
    <div class="d-flex flex-wrap gap-2 gth-date-range-presets" hidden>
      
      <button type="button" class="btn btn-sm rounded-pill gth-chip" data-preset="today" aria-pressed="false">
        <i class="bi bi-check-lg gth-chip-check" aria-hidden="true"></i>Today</button>
      
      <button type="button" class="btn btn-sm rounded-pill gth-chip" data-preset="month" aria-pressed="false">
        <i class="bi bi-check-lg gth-chip-check" aria-hidden="true"></i>This month</button>
      
      <button type="button" class="btn btn-sm rounded-pill gth-chip" data-preset="fy" aria-pressed="false">
        <i class="bi bi-check-lg gth-chip-check" aria-hidden="true"></i>This FY</button>
      
      <button type="button" class="btn btn-sm rounded-pill gth-chip" data-preset="last_fy" aria-pressed="false">
        <i class="bi bi-check-lg gth-chip-check" aria-hidden="true"></i>Last FY</button>
      
    </div>
    
  </div>
  
  
</div>
