
        

<div class="mb-3 gth-form-field gth-date-range" role="group" aria-labelledby="gth-field-from-label"
  data-gth-date-range data-fy-start-month="7">
  <span class="form-label d-block" id="gth-field-from-label">Period</span>
  <div class="d-flex flex-wrap align-items-center gap-2">
    
    <div class="input-group w-auto">
      <label class="input-group-text" for="gth-field-from">From</label>
      <input type="date" class="form-control is-invalid" id="gth-field-from" name="from"
        value="2025-07-01" data-gth-date-from aria-invalid="true" aria-describedby="gth-field-from-help gth-field-from-error">
    </div>
    
    <div class="input-group w-auto">
      <label class="input-group-text" for="gth-field-to">To</label>
      <input type="date" class="form-control is-invalid" id="gth-field-to" name="to"
        value="2026-06-30" data-gth-date-to aria-invalid="true" aria-describedby="gth-field-from-help gth-field-from-error">
    </div>
    
    
    <div class="d-flex flex-wrap gap-2 gth-date-range-presets" hidden>
      
      <button type="button" class="btn btn-sm rounded-pill gth-chip" data-preset="today" aria-pressed="false">
        <i class="bi bi-check-lg gth-chip-check" aria-hidden="true"></i>Today</button>
      
      <button type="button" class="btn btn-sm rounded-pill gth-chip" data-preset="month" aria-pressed="false">
        <i class="bi bi-check-lg gth-chip-check" aria-hidden="true"></i>This month</button>
      
      <button type="button" class="btn btn-sm rounded-pill gth-chip" data-preset="fy" aria-pressed="false">
        <i class="bi bi-check-lg gth-chip-check" aria-hidden="true"></i>This FY</button>
      
      <button type="button" class="btn btn-sm rounded-pill gth-chip" data-preset="last_fy" aria-pressed="false">
        <i class="bi bi-check-lg gth-chip-check" aria-hidden="true"></i>Last FY</button>
      
    </div>
    
  </div>
  <div class="form-text" id="gth-field-from-help">Inclusive.</div>
  
  <div class="invalid-feedback d-block" id="gth-field-from-error">
    From must be before To.
  </div>
  
</div>
