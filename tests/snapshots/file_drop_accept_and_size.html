
<div class="mb-3 gth-form-field gth-file-drop" data-gth-file-drop data-accept=".csv,.xlsx" data-max-size="5242880" data-max-label="5 MB">
  <span class="form-label d-block" id="gth-field-docs-label">Documents</span>
  <input type="file" class="visually-hidden gth-file-drop-input" id="gth-field-docs" name="docs"
    aria-labelledby="gth-field-docs-label"
    aria-describedby="gth-field-docs-hint gth-field-docs-help gth-field-docs-error" accept=".csv,.xlsx" multiple required="required">
  <label class="gth-file-drop-zone" for="gth-field-docs">
    <i class="bi bi-cloud-arrow-up gth-file-drop-icon" aria-hidden="true"></i>
    <span class="gth-file-drop-prompt">Drop files here or browse</span>
    <span class="gth-file-drop-hint" id="gth-field-docs-hint">CSV, XLSX · up to 5 MB</span>
  </label>
  <ul class="gth-file-drop-files list-unstyled" hidden></ul>
  <ul class="gth-file-drop-errors list-unstyled" id="gth-field-docs-error" aria-live="polite"></ul>
  <div class="progress gth-file-drop-progress" role="progressbar" aria-label="Upload progress"
    aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" hidden>
    <div class="progress-bar" style="width: 0%"></div>
  </div>
  <div class="form-text" id="gth-field-docs-help">Re-uploading is safe.</div>
</div>
