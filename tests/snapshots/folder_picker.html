
<div class="mb-3 gth-form-field gth-folder-picker" data-gth-folder-picker
  data-gth-folder-picker-url="/folders">
  <label class="form-label" for="lib">Library folder</label>
  <div class="input-group">
    <span class="input-group-text" aria-hidden="true"><i class="bi bi-folder2"></i></span>
    <input type="text" class="form-control gth-folder-picker-input" id="lib"
      name="library" value="D:/Music" autocomplete="off" spellcheck="false" aria-describedby="lib-help"
      data-gth-folder-picker-input>
    <button type="button" class="btn btn-outline-secondary gth-folder-picker-browse" data-gth-folder-picker-browse
      aria-haspopup="dialog" aria-controls="lib-dialog">Browse…</button>
  </div><div class="form-text" id="lib-help">Where your music lives</div>
  <div class="modal fade gth-modal gth-folder-picker-modal" id="lib-dialog" tabindex="-1"
    aria-labelledby="lib-dialog-label" aria-hidden="true" data-gth-folder-picker-modal
    data-gth-folder-picker-for="lib">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="lib-dialog-label">Choose library folder</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body gth-folder-picker-body" data-gth-folder-picker-body>

<div class="placeholder-glow gth-skeleton " aria-hidden="true">
  <span class="placeholder d-block mb-2 col-12"></span><span class="placeholder d-block mb-2 col-12"></span><span class="placeholder d-block mb-2 col-12"></span><span class="placeholder d-block mb-2 col-12"></span><span class="placeholder d-block mb-2 col-7"></span>
</div>
</div>
      </div>
    </div>
  </div>
</div>
