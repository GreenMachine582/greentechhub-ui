# repo-kit's config for this repo: the one input to everything rk generates or applies.
# Written by hand at adoption; it is yours from here on. Every key and its default:
# https://github.com/GreenMachine582/repo-kit/blob/main/docs/configuration.md

version = "0.4.0"            # the one pin; change it with `rk upgrade`
profile = "dev-main"

[project]
name = "greentechhub-ui"
release_type = "python"

[checks]
# This repo's own CI jobs (ci.yml), required next to the pr-checks ones.
required = ["test", "e2e"]

[worktree]
# `rk wt start` builds each worktree its own venv. `--python .venv` keeps the install in it even when
# another venv is active in the shell (VIRTUAL_ENV would otherwise win).
setup = ["uv venv", "uv pip install --python .venv -e .[dev,playground]"]
check = "uv run --no-sync --python .venv pytest -q"
env_dirs = [".venv"]
